name: Publish welcome page
on:
  push:
    branches: [main]
    paths: ['site/**', 'scripts/build-welcome-locales.cjs', 'scripts/test-welcome*.cjs', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Generate and validate language pages
        run: |
          node scripts/build-welcome-locales.cjs
          node scripts/test-welcome.cjs
          node scripts/test-welcome-seo.cjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
